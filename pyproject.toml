[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacion-internacion"
version = "0.1.0"
description = "Simulador de eventos discretos del sub-sistema de internación (SimPy)"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["simulacion*", "analisis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
